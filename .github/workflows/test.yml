name: Test Meme Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Python-Dateien auf Syntaxfehler pruefen
        run: |
          python -m py_compile scripts/discover.py
          python -m py_compile scripts/publish.py

      - name: Vorhandensein der Secrets pruefen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os

          for name in ("IG_USER_ID", "IG_ACCESS_TOKEN"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Secret fehlt oder ist leer: {name}")

          print("Beide Secrets sind vorhanden. Werte werden nicht ausgegeben.")
          PY

      - name: Memes entdecken
        run: python scripts/discover.py

      - name: Discovery-Ergebnis pruefen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/discovery_queue.json")

          if not path.exists():
              raise SystemExit(
                  "Keine Queue erzeugt. Bitte Discovery-Log auf "
                  "Abruffehler oder fehlende Kandidaten pruefen."
              )

          queue = json.loads(path.read_text(encoding="utf-8"))
          candidates = [
              item for item in queue
              if isinstance(item, dict)
              and item.get("status") == "queued"
              and item.get("image_url")
          ]

          print(f"Verfuegbare Kandidaten: {len(candidates)}")

          if not candidates:
              raise SystemExit("Keine geeigneten Kandidaten in der Queue.")
          PY

      - name: Publishing im Trockenlauf testen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: "true"
        run: python scripts/publish.py
